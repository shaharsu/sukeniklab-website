<a class="skip-link" href="#main">Skip to main content</a>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">SUKENIK LAB</a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label" aria-label="Toggle menu"><span></span></label>
    <nav class="site-nav" aria-label="Main">
      <ul>
        {%- for item in site.data.nav -%}
        {%- assign href = item.url | relative_url -%}
        <li><a href="{{ href }}"{% if page.url == item.url %} class="current" aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {%- endfor -%}
        <li><a class="btn-join" href="{{ '/team/' | relative_url }}#join-us">JOIN US</a></li>
      </ul>
    </nav>
  </div>
</header>
